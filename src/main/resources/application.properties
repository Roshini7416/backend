# ---------- Server ----------
server.port=8080

# ---------- MySQL connection ----------
# Format: ${ENVIRONMENT_VARIABLE:default value}
# If the environment variable is not set, the default after the colon is used.
# EASIEST WAY: change the default password below (the part after "DB_PASSWORD:").
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tiger}

# ---------- Authentication ----------
# Sessions are random tokens stored (hashed) in the user_sessions table and sent to the browser
# in an HttpOnly cookie. No secret key is needed, so there is nothing secret to put here.
app.session.days=${SESSION_DAYS:7}
# Must be true when the site is served over HTTPS (production). false is needed for http://localhost.
app.cookie.secure=${COOKIE_SECURE:false}
# Comma-separated list of frontend origins allowed to call the API with cookies.
app.cors.allowed-origins=http://localhost:5174,http://127.0.0.1:5174
